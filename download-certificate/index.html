<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download Certificate | Yuvantara</title><link rel="stylesheet" href="../assets/style.css">
<style>body{background:#f4f6fb;color:#111}main{max-width:480px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #dde3ee;border-radius:12px;padding:20px}input,select{width:100%;padding:10px;margin:4px 0 12px;border:1px solid #c9d1e2;border-radius:8px;font:inherit;box-sizing:border-box}button{padding:11px 18px;border:0;border-radius:8px;background:#1b4283;color:#fff;font-weight:600;cursor:pointer}#m{margin-top:12px;font-size:14px}</style></head><body><main><div class="card">
<h2>Download your Certificate / Offer Letter</h2><p>Enter the certificate number from your email and the email address it was sent to.</p>
<form id="f"><label>Certificate number</label><input id="n" required placeholder="YV-2026-000001"><label>Email</label><input id="e" type="email" required><label>Document</label><select id="k"><option value="certificate">Internship Certificate</option><option value="offer">Offer Letter</option><option value="invoice">Invoice</option></select><button>Download PDF</button></form><div id="m"></div></div>
<script src="../assets/config.js"></script><script>
var p=new URLSearchParams(location.search).get('id');if(p)document.getElementById('n').value=p;
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var m=document.getElementById('m');m.textContent='Preparing…';
fetch(((window.YUVANTARA_CONFIG&&((YUVANTARA_CONFIG.api&&YUVANTARA_CONFIG.api.baseUrl)||YUVANTARA_CONFIG.baseUrl))||'/api')+'/documents/download',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({certNo:n.value.trim(),email:e.value.trim(),kind:k.value})})
.then(function(r){if(!r.ok)return r.json().then(function(j){throw new Error(j.error||'Error')});return r.blob()}).then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(k.value==='offer'?'Offer-Letter-':k.value==='invoice'?'Invoice-':'Internship-Certificate-')+n.value.trim()+'.pdf';a.click();m.textContent='Downloaded ✔'}).catch(function(x){m.textContent=x.message})};
</script></main></body></html>
